name: "Fly.io Diagnostic Logs"

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: "Capture Fly.io logs and status"
    runs-on: ubuntu-latest
    environment: FLY_API_TOKEN

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: App status
        run: flyctl status --app mvprotect || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: List machines
        run: flyctl machine list --app mvprotect || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Recent logs
        run: timeout 30 flyctl logs --app mvprotect --no-tail || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
