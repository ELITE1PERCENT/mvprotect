name: "Fly.io Diagnostic Logs"

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: "Start machine and capture boot logs"
    runs-on: ubuntu-latest
    environment: FLY_API_TOKEN

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Get machine id
        id: mid
        run: |
          MID=$(flyctl machine list --app mvprotect --json | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['id'])")
          echo "mid=$MID" >> $GITHUB_OUTPUT
          echo "Machine: $MID"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Start machine
        run: flyctl machine start ${{ steps.mid.outputs.mid }} --app mvprotect || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Wait for boot
        run: sleep 20

      - name: Capture logs
        run: timeout 40 flyctl logs --app mvprotect --no-tail || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Machine status
        run: flyctl status --app mvprotect || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
