name: "Fly.io Diagnostic Logs"

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: "Status and recent app logs"
    runs-on: ubuntu-latest
    environment: FLY_API_TOKEN

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Status
        run: flyctl status --app mvprotect || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Last app log lines (redacted)
        run: |
          timeout 25 flyctl logs --app mvprotect --no-tail > /tmp/full.log 2>&1 || true
          echo "=================== LAST 25 APP LINES ==================="
          sed -E 's#https?://[^ ]+#[URL]#g; s#postgres://[^ ]+#[DBURL]#g' /tmp/full.log | tail -25
          echo "=================== END ==================="
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
