# ============================================================================
# MV PROTECT — Configuration Fly.io
# Modifiez app = "..." avec le nom que vous choisissez lors du `fly launch`
# ============================================================================

app = "mvprotect"
primary_region = "cdg"   # Paris Charles-de-Gaulle

[build]
  dockerfile = "Dockerfile"

[env]
  PORT       = "8080"
  NODE_ENV   = "production"
  # JWT_EXPIRES_IN est défini via `fly secrets set` (voir ci-dessous)

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval     = "15s"
    method       = "GET"
    path         = "/api/healthz"
    port         = 8080
    timeout      = "5s"
    type         = "http"
